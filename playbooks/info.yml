---
# What a primary server has. Reads only.
#
#   NBU_API_KEY=... uv run ansible-playbook playbooks/info.yml -e nbu_primary=<host>
#
# Without -e nbu_ca_bundle=<pem>, the primary's CA is downloaded to
# out/ca/<host>.pem and pinned there. The first time, it stops and lists the
# CA's fingerprints: compare them with `nbcertcmd -displayCACertDetail` on the
# primary, then run again with -e nbu_ca_fingerprint=<the SHA-256 one>
# (or -e nbu_ca_accept_new=true where the path to the primary is trusted).
- name: Read a NetBackup primary server
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    nbu_api: "{{ nbu_url if nbu_url is defined else 'https://' ~ nbu_primary ~ ':1556/netbackup' }}"
    nbu_ca_file: >-
      {{ nbu_ca_bundle if nbu_ca_bundle is defined
         else (playbook_dir | dirname) ~ '/out/ca/' ~ (nbu_api | urlsplit('hostname')) ~ '.pem' }}
  module_defaults:
    group/yoki.netbackup.nbu:
      url: "{{ nbu_api }}"
      ca_bundle: "{{ nbu_ca_file }}"
  tasks:
    - name: The primary's CA certificate (checked by fingerprint, then pinned)
      yoki.netbackup.nbu_ca_cert:  # noqa: args[module] (url comes from module_defaults)
        dest: "{{ nbu_ca_file }}"
        fingerprint: "{{ nbu_ca_fingerprint | default(omit) }}"
        accept_new: "{{ nbu_ca_accept_new | default(false) | bool }}"
      when: nbu_ca_bundle is not defined

    - name: Server, policies and SLPs
      yoki.netbackup.nbu_info:  # noqa: args[module] (url comes from module_defaults)
        gather_subset: [server, policies, slps]
      register: nbu

    - name: Show them
      ansible.builtin.debug:
        msg:
          server: "{{ nbu.netbackup.server }}"
          policies: "{{ nbu.netbackup.policies | map(attribute='name') | list }}"
          slps: "{{ nbu.netbackup.slps | map(attribute='slpName') | list }}"
